name: Dropi Master Scanner (Cloud Tracker)

on:
  schedule:
    # 4 veces al día (Hora Colombia UTC-5):
    # 09:00 UTC = 04:00 AM Colombia
    # 16:00 UTC = 11:00 AM Colombia
    # 20:00 UTC = 03:00 PM Colombia
    # 00:00 UTC = 07:00 PM Colombia
    - cron: '0 0,9,16,20 * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: 'Cantidad de páginas a escanear (25 = ~1.000 prods de prueba | 1750 = ~70.000 prods)'
        required: true
        default: '25'

permissions:
  contents: write

jobs:
  scrape_and_release:
    name: Escáner Dropi Colombia
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install aiohttp

      - name: Ejecutar Escáner Continuo
        env:
          DROPI_TOKEN: ${{ secrets.DROPI_TOKEN_1 || secrets.DROPI_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python cloud_worker.py --pages ${{ github.event.inputs.pages || '25' }}

      - name: Comprimir Catálogo
        run: |
          zip -9 catalog.db.zip catalog.db

      - name: Publicar Release con Catálogo Consolidado
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.0-data"
          name: "Catálogo Dropi Colombia Automatizado"
          body: "Base de datos consolidada con 32.000 productos auditados de Dropi Colombia."
          files: catalog.db.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
