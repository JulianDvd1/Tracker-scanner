name: Dropi Master Scanner (Cloud Tracker)

on:
  schedule:
    # 6am, 8am, 10am, 12pm, 2pm, 4pm, 6pm y 8pm (Hora Colombia / UTC-5)
    - cron: '0 1,11,13,15,17,19,21,23 * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: 'Cantidad de páginas a escanear (1250 = ~50.000 productos)'
        required: true
        default: '1250'

permissions:
  contents: write

jobs:
  scrape_and_release:
    name: Escáner Dropi Colombia (50k Productos)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Escáner Continuo (50.000 Productos)
        env:
          GOOGLE_PROXY_URLS: ${{ secrets.GOOGLE_PROXY_URLS }}
          DROPI_TOKEN_1: ${{ secrets.DROPI_TOKEN_1 }}
          DROPI_TOKEN_2: ${{ secrets.DROPI_TOKEN_2 }}
          DROPI_TOKEN_3: ${{ secrets.DROPI_TOKEN_3 }}
          DROPI_TOKEN_4: ${{ secrets.DROPI_TOKEN_4 }}
          DROPI_TOKEN: ${{ secrets.DROPI_TOKEN_1 || secrets.DROPI_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python cloud_worker.py --pages ${{ github.event.inputs.pages || '1250' }}

      - name: Comprimir Catálogo
        run: |
          zip -9 catalog.db.zip catalog.db

      - name: Publicar Release con Catálogo Consolidado
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.0-data"
          name: "Catálogo Dropi Colombia Automatizado"
          body: "Base de datos consolidada con 50.000 productos auditados de Dropi Colombia."
          files: catalog.db.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
