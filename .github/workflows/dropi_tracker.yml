name: Dropi Master Scanner (32k Productos)

on:
  schedule:
    # 4 veces al día (Hora Colombia UTC-5):
    # 09:00 UTC = 04:00 AM Colombia
    # 15:00 UTC = 10:00 AM Colombia
    # 19:00 UTC = 02:00 PM Colombia
    # 23:00 UTC = 06:00 PM Colombia
    - cron: '0 9,15,19,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape_and_release:
    name: Escáner Maestro 32.000 Productos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install aiohttp

      - name: Ejecutar Escáner Continuo (800 Páginas)
        env:
          DROPI_TOKEN: ${{ secrets.DROPI_TOKEN_1 || secrets.DROPI_TOKEN }}
          DROPI_TOKEN_1: ${{ secrets.DROPI_TOKEN_1 }}
          DROPI_TOKEN_2: ${{ secrets.DROPI_TOKEN_2 }}
          DROPI_TOKEN_3: ${{ secrets.DROPI_TOKEN_3 }}
          DROPI_TOKEN_4: ${{ secrets.DROPI_TOKEN_4 }}
          PYTHONUNBUFFERED: "1"
        run: |
          python cloud_worker.py --pages 800

      - name: Comprimir Catálogo
        run: |
          zip -9 catalog.db.zip catalog.db

      - name: Publicar Release con Catálogo Consolidado
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.0-data"
          name: "Catálogo Dropi Colombia Automatizado"
          body: "Base de datos consolidada con 32.000 productos auditados de Dropi Colombia."
          files: catalog.db.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
