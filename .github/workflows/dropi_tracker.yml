name: Dropi Master Scanner (Cloud Tracker)

on:
  schedule:
    # Cada 2 horas en punto (12:00, 14:00, 16:00, 18:00, 20:00... Hora Colombia)
    - cron: '0 1-23/2 * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: 'Cantidad de páginas a escanear (20 = prueba rápida | 1730 = Catálogo 100% Completo ~69.000 productos)'
        required: true
        default: '1730'

concurrency:
  group: dropi-master-scanner
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  activar_worker2:
    name: Sincronizar y Activar Worker 2
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Worker 2 via API
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/JulianDvd1/Tracker-scanner-worker2/actions/workflows/dropi_worker2.yml/dispatches \
            -d '{"ref":"main","inputs":{"pages":"${{ github.event.inputs.pages || '''1730''' }}"}}' || true

  scan_shards:
    name: Shard ${{ matrix.shard }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            os: ubuntu-latest
            token_index: 1
          - shard: 1
            os: windows-latest
            token_index: 2
          - shard: 2
            os: macos-latest
            token_index: 3
          - shard: 3
            os: ubuntu-22.04
            token_index: 4
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Shard en Modo Directo
        env:
          DROPI_TOKEN_1: ${{ secrets.DROPI_TOKEN_1 }}
          DROPI_TOKEN_2: ${{ secrets.DROPI_TOKEN_2 }}
          DROPI_TOKEN_3: ${{ secrets.DROPI_TOKEN_3 }}
          DROPI_TOKEN_4: ${{ secrets.DROPI_TOKEN_4 }}
          DROPI_TOKEN: ${{ secrets.DROPI_TOKEN_1 || secrets.DROPI_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python cloud_worker.py --shard-id ${{ matrix.shard }} --total-shards 8 --pages ${{ github.event.inputs.pages || '1730' }} --token-index ${{ matrix.token_index }} --db-name catalog_shard_${{ matrix.shard }}.db

      - name: Subir Base de Datos del Shard
        uses: actions/upload-artifact@v4
        with:
          name: catalog_shard_${{ matrix.shard }}
          path: catalog_shard_${{ matrix.shard }}.db
          if-no-files-found: error

  consolidar_y_publicar:
    name: Consolidar Shards y Publicar Release
    needs: scan_shards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar Todos los Shards
        uses: actions/download-artifact@v4
        with:
          pattern: catalog_shard_*
          path: downloaded_shards

      - name: Fusionar Shards en Catálogo Maestro
        run: |
          python cloud_merge.py

      - name: Publicar Release con Catálogo Consolidado
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.0-data"
          name: "Catálogo Dropi Colombia Automatizado (50k)"
          body_path: release_body.md
          files: catalog.db.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resumen en GitHub Actions
        if: always()
        run: |
          if [ -f release_body.md ]; then
            cat release_body.md >> $GITHUB_STEP_SUMMARY
          fi
