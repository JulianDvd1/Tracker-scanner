name: Dropi Matrix Scanner

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    name: Dropi Cloud Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install aiohttp

      - name: Ejecutar Auditoría Dropi
        env:
          DROPI_TOKEN: ${{ secrets.DROPI_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python cloud_worker.py --pages 250

      - name: Consolidar y Comprimir Base de Datos
        run: python cloud_merge.py

      - name: Publicar Catálogo en Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: "Catálogo Actualizado Dropi Colombia"
          files: catalog.db.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
